<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Login | VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="nav"><a class="logo" href="index.html">VoyageVista</a></nav>
  <main class="auth-wrap">
    <form class="form-card" data-mode="login">
      <h2>Welcome back</h2>
      <p class="muted">Login to manage your trips.</p>
      <div id="notice" class="notice"></div>
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Password</label><input type="password" name="password" required></div><button
        class="btn" style="width:100%">Login</button>
      <p>New here? <a href="signup.html" style="color:#0f766e">Create an account</a></p>
    </form>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/footer.js"></script>
</body>

</html>
