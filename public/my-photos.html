<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>My Photos | VoyageVista</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .vault-form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 28px;
      box-shadow: 0 2px 12px #0000000d
    }

    .vault-form select,
    .vault-form input[type=text] {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px
    }

    .vault-form input[type=text] {
      flex: 1;
      min-width: 160px
    }

    .photo-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block
    }

    #msg {
      margin: 0 0 16px;
      color: var(--brand);
      font-weight: 700
    }

    .photo-card img {
      cursor: zoom-in
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000e6;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .lightbox.open {
      display: flex
    }

    .lightbox figure {
      margin: 0;
      max-width: 90vw;
      text-align: center;
      color: white
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 78vh;
      border-radius: 10px;
      object-fit: contain
    }

    .lightbox figcaption {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .lb-close {
      position: absolute;
      top: 14px;
      right: 24px;
      font-size: 40px;
      background: none;
      border: 0;
      color: white;
      cursor: pointer
    }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 44px;
      background: #ffffff22;
      border: 0;
      color: white;
      cursor: pointer;
      width: 52px;
      height: 52px;
      border-radius: 50%
    }

    .lb-prev {
      left: 20px
    }

    .lb-next {
      right: 20px
    }
  </style>
</head>

<body>
  <nav class="nav"><a class="logo" href="index.html">VoyageVista</a>
    <div class="navlinks"><a href="explore.html">Explore</a><a href="trip-planner.html">Trip Planner</a><span
        id="authNav"></span></div>
  </nav>
  <main class="section">
    <h2>My Trip Photos</h2>
    <p class="lead">Keep your travel memories in one place, sorted by destination.</p>
    <form class="vault-form" id="uploadForm"><select id="dest" name="destination_id" required></select><input
        type="text" id="caption" name="caption" placeholder="Caption (optional)" maxlength="255"><input type="file"
        id="file" name="photo" accept="image/jpeg,image/png,image/webp" required><img id="prev" alt=""
        style="display:none;width:64px;height:48px;object-fit:cover;border-radius:8px"><button class="btn"
        type="submit">Upload</button></form>
    <p id="msg"></p>
    <div style="margin-bottom:20px"><select id="filter">
        <option value="">All destinations</option>
      </select></div>
    <div class="grid" id="grid"></div>
  </main>
  <div id="lightbox" class="lightbox">
    <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <figure><img id="lbImg" alt="">
      <figcaption><strong id="lbTitle"></strong><span id="lbCap"></span></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  </div>
  <script src="js/common.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/footer.js"></script>
</body>

</html>
